<!-- Historical token/rate filters and chart mounts, backed by the model statistics API. -->
<div id="modelStatsView" class="view view-panel"><h1 class="page-title">Model Stats</h1><div class="page-sub">Prompt processing, generation and token history for saved model configurations.</div><div class="model-stats-layout"><div class="card"><div class="row"><h2>Models</h2><button id="refreshModelStats" type="button">Refresh</button></div><div id="modelStatsList" class="model-stats-list"><span class="muted">Loading model history...</span></div></div><div class="card"><div class="model-stats-filters"><div class="field"><label for="modelStatsRange">Time range</label><select id="modelStatsRange"><option value="1">Today</option><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="365">Last 365 days</option><option value="all">All time</option></select></div><div class="field"><label for="modelStatsConfig">Model configuration</label><select id="modelStatsConfig"><option value="all">All configurations</option></select></div><div class="field"><label for="modelStatsGroup">Group by</label><select id="modelStatsGroup"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option></select></div><div class="field"><label for="modelStatsMetric">Chart</label><select id="modelStatsMetric"><option value="tokens">Tokens</option><option value="prefill">Prefill speed</option><option value="decode">Decode speed</option></select></div></div><div id="modelStatsSummary" class="model-stats-summary"></div><div id="modelStatsChart" class="model-stats-chart"></div><h2>Period history</h2><div class="model-stats-table" id="modelStatsDays"></div><p class="muted model-stats-note" id="modelStatsNote"></p></div></div></div>
