<!-- Stable field names and autocomplete hints keep browser history separate from presets. -->
<!-- Startup moves these existing alias/build controls into editorIdentityGrid; never duplicate IDs. -->
<div class="card mode-card" id="modeCard"><h2>Server mode</h2><div class="grid two">
<div class="field" id="singleBuildField"><label id="buildLabel">llama.cpp build</label><select id="build" name="visllama-model-build" autocomplete="off">{{{BUILD_OPTIONS}}}</select><div id="buildStatus" class="muted"></div></div>
<div class="field"><label>Mode <span class="info" tabindex="0" data-tip="Single Model launches one GGUF directly. Router / Multi-model starts llama.cpp without -m and exposes only models saved into the managed Router Presets catalog.">i</span></label><select id="serverMode" name="visllama-model-serverMode" autocomplete="off"><option value="single">Single model</option><option value="router">Router / multi-model</option></select></div>
<div class="field" id="singleAliasField"><label for="alias">API model alias <span class="info" tabindex="0" data-tip="Editable model name exposed to OpenAI-compatible clients and used as this Router Preset's model ID.">i</span></label><input id="alias" placeholder="e.g. Qwen3.8-27B-Q8" aria-describedby="aliasHint aliasError aliasWarning" name="visllama-model-alias" autocomplete="off"><small id="aliasHint">Use letters, numbers, dots, underscores, colons or hyphens. No spaces or parentheses; for example, Model-test.</small><small id="aliasWarning" class="preset-name-warning hidden" role="status" aria-live="polite"></small><small id="aliasError" class="alias-error hidden" role="alert"></small></div>
</div></div>
