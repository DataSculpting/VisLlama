<!-- Confirm replacing another preset. Cancel is first for safe keyboard focus. -->
<div id="presetOverwriteModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="presetOverwriteTitle" aria-describedby="presetOverwriteDescription"><div class="modal-dialog narrow"><div class="modal-head"><h2 id="presetOverwriteTitle">Overwrite existing model preset?</h2></div><div class="modal-body"><p id="presetOverwriteDescription">A model preset already uses the name <strong id="presetOverwriteName"></strong>. Continuing will replace its saved settings with those in this editor.</p><p>The GGUF model file is not deleted. Choose Cancel to return and use a different name.</p><div class="row"><button type="button" id="presetOverwriteCancel">Cancel</button><button type="button" class="danger" id="presetOverwriteProceed">Overwrite settings</button></div></div></div></div>
